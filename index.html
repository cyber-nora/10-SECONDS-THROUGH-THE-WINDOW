<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10 SECONDS : THROUGH THE WINDOW - nora</title>
  <style>
    /* 全体スタイリング */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0d0d0d;
      color: #e6e6e6;
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
      user-select: none;
    }

    /* 左上：NORAロゴ＆コピー */
    .brand-header {
      position: absolute;
      top: 24px;
      left: 24px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      z-index: 10;
    }
    .brand-logo {
      height: 28px;
      width: auto;
      object-fit: contain;
    }
    .brand-tagline {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      color: #a0a0a0;
      font-weight: 300;
    }

    /* 右下：作品名＆制作年 */
    .work-info {
      position: absolute;
      bottom: 24px;
      right: 24px;
      text-align: right;
      z-index: 10;
    }
    .work-title {
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      color: #cccccc;
      font-weight: 400;
    }
    .work-year {
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      color: #777777;
      margin-top: 2px;
    }

    /* 中央：メインディスプレイ（画像＋詩） */
    .viewport {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .image-container {
      position: relative;
      width: 85vw;
      max-width: 500px;
      aspect-ratio: 9 / 16;
      max-height: 70vh;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
      overflow: hidden;
    }

    .window-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 1.5s ease-in-out;
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
    }

    .window-image.active {
      opacity: 1;
    }

    /* 10秒の詩（オーバーレイ表示） */
    .poem-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
      box-sizing: border-box;
      background: rgba(0, 0, 0, 0.25);
      z-index: 5;
      pointer-events: none;
    }

    .poem-text {
      color: #ffffff;
      font-size: 0.95rem;
      line-height: 2.2;
      letter-spacing: 0.25em;
      text-align: center;
      writing-mode: vertical-rl; /* 縦書きで文学的な雰囲気に */
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
      opacity: 0;
      transition: opacity 2s ease-in-out;
    }

    .poem-text.visible {
      opacity: 1;
    }

    /* カウントダウン表示（微かに可視化） */
    .timer-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 2px;
      background-color: rgba(255, 255, 255, 0.5);
      width: 0%;
      transition: width 0.1s linear;
      z-index: 6;
    }

    /* 下部：トラック選択コントロール */
    .controls {
      position: absolute;
      bottom: 60px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px 24px;
      z-index: 10;
      padding: 0 20px;
      max-width: 600px;
    }

    .track-btn {
      background: none;
      border: none;
      color: #888888;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      cursor: pointer;
      padding: 6px 12px;
      transition: all 0.4s ease;
      position: relative;
    }

    .track-btn:hover {
      color: #ffffff;
    }

    .track-btn.active {
      color: #ffffff;
    }

    .track-btn.active::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 12px;
      height: 1px;
      background-color: #ffffff;
    }

    /* スマホ調整 */
    @media (max-width: 600px) {
      .controls {
        bottom: 70px;
        gap: 12px 16px;
      }
      .track-btn {
        font-size: 0.7rem;
        padding: 4px 8px;
      }
      .poem-text {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>

  <!-- 左上：NORAロゴ＆コピー -->
  <div class="brand-header">
    <img src="images/logo.png" alt="nora" class="brand-logo" id="logo-img" onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='block';">
    <span id="logo-fallback" style="display:none; font-weight:bold; font-size:1.1rem; letter-spacing:0.15em;">nora</span>
    <span class="brand-tagline">音は、時代を旅する。</span>
  </div>

  <!-- 右下：作品情報 -->
  <div class="work-info">
    <div class="work-title">10 SECONDS : THROUGH THE WINDOW</div>
    <div class="work-year">2026</div>
  </div>

  <!-- 中央：窓と景色ディスプレイ -->
  <div class="viewport">
    <div class="image-container">
      <!-- ベース画像 -->
      <img src="images/base.jpg" alt="Window Base" class="window-image active" id="img-base">
      
      <!-- 各トラック用画像 -->
      <img src="images/01_morning.jpg" alt="Morning" class="window-image" id="img-morning">
      <img src="images/02_daytime.jpg" alt="Daytime" class="window-image" id="img-daytime">
      <img src="images/03_wind.jpg" alt="Wind" class="window-image" id="img-wind">
      <img src="images/04_rain.jpg" alt="Rain" class="window-image" id="img-rain">
      <img src="images/05_last_train.jpg" alt="Last Train" class="window-image" id="img-last_train">
      <img src="images/06_night.jpg" alt="Night" class="window-image" id="img-night">

      <!-- 10秒の詩（オーバレイ） -->
      <div class="poem-overlay">
        <div class="poem-text" id="poem-text"></div>
      </div>

      <!-- 進行プログレスバー -->
      <div class="timer-bar" id="timer-bar"></div>
    </div>
  </div>

  <!-- 下部：トラック選択ボタン -->
  <div class="controls">
    <button class="track-btn" onclick="playTrack('morning')">MORNING</button>
    <button class="track-btn" onclick="playTrack('daytime')">DAYTIME</button>
    <button class="track-btn" onclick="playTrack('wind')">WIND</button>
    <button class="track-btn" onclick="playTrack('rain')">RAIN</button>
    <button class="track-btn" onclick="playTrack('last_train')">LAST TRAIN</button>
    <button class="track-btn" onclick="playTrack('night')">NIGHT</button>
  </div>

  <script>
    // ==========================================
    // トラック設定（画像・音源・詩）
    // 後からテキストやファイル名を簡単に編集できます
    // ==========================================
    const tracks = {
      'morning': {
        imageId: 'img-morning',
        audioSrc: 'audio/01_morning.mp3',
        poem: '朝の光が、昨日と今日の境目をひらく。'
      },
      'daytime': {
        imageId: 'img-daytime',
        audioSrc: 'audio/02_daytime.mp3',
        poem: 'どこか遠くの営みが、風に乗って掠めていく。'
      },
      'wind': {
        imageId: 'img-wind',
        audioSrc: 'audio/03_wind.mp3',
        poem: '見えない時間が、葉を揺らして走り抜ける。'
      },
      'rain': {
        imageId: 'img-rain',
        audioSrc: 'audio/04_rain.mp3',
        poem: '世界を叩く雫が、あの日の記憶を連れてくる。'
      },
      'last_train': {
        imageId: 'img-last_train',
        audioSrc: 'audio/05_last_train.mp3',
        poem: '遠ざかる轍の音が、街の眠りを告げている。'
      },
      'night': {
        imageId: 'img-night',
        audioSrc: 'audio/06_night.mp3',
        poem: '静寂の底で、虫の羽音だけが時代を旅する。'
      }
    };

    let currentAudio = null;
    let timerInterval = null;
    let resetTimeout = null;
    let activeTrackKey = null;

    function playTrack(key) {
      // 停止・初期化処理
      stopCurrent();

      activeTrackKey = key;
      const track = tracks[key];
      if (!track) return;

      // 1. 画像の切り替え（フェードイン）
      document.querySelectorAll('.window-image').forEach(img => img.classList.remove('active'));
      const targetImg = document.getElementById(track.imageId);
      if (targetImg) targetImg.classList.add('active');

      // 2. ボタンアクティブ状態の設定
      document.querySelectorAll('.track-btn').forEach(btn => {
        if (btn.getAttribute('onclick').includes(`'${key}'`)) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      // 3. 詩の表示
      const poemEl = document.getElementById('poem-text');
      poemEl.innerText = track.poem;
      setTimeout(() => {
        poemEl.classList.add('visible');
      }, 500); // 0.5秒後にじわっと表示

      // 4. 音声の再生
      currentAudio = new Audio(track.audioSrc);
      currentAudio.play().catch(e => console.log("Audio play error:", e));

      // 5. プログレスバー（10秒アニメーション）
      const progressBar = document.getElementById('timer-bar');
      progressBar.style.width = '0%';
      let elapsed = 0;
      const duration = 10000; // 10秒

      timerInterval = setInterval(() => {
        elapsed += 100;
        const progress = (elapsed / duration) * 100;
        progressBar.style.width = `${Math.min(progress, 100)}%`;
        if (elapsed >= duration) {
          clearInterval(timerInterval);
        }
      }, 100);

      // 6. 10秒後に初期状態（base.jpg）へ静かに復帰
      resetTimeout = setTimeout(() => {
        resetToBase();
      }, 10000);
    }

    function stopCurrent() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }
      if (timerInterval) clearInterval(timerInterval);
      if (resetTimeout) clearTimeout(resetTimeout);

      document.getElementById('poem-text').classList.remove('visible');
      document.getElementById('timer-bar').style.width = '0%';
    }

    function resetToBase() {
      stopCurrent();
      
      // 画像をbaseに戻す
      document.querySelectorAll('.window-image').forEach(img => img.classList.remove('active'));
      document.getElementById('img-base').classList.add('active');

      // ボタンのアクティブ解除
      document.querySelectorAll('.track-btn').forEach(btn => btn.classList.remove('active'));
      activeTrackKey = null;
    }
  </script>
</body>
</html>
