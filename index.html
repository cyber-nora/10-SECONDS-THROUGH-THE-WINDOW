<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10 SECONDS : THROUGH THE WINDOW - nora</title>
  <style>
    /* 全体スタイリング：モダンギャラリーの空間ライティング（スポットライト効果） */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      /* 中央は光が当たる明るいニュアンスホワイト、外側へ向けてかすかな陰影 */
      background: radial-gradient(circle at center, #f8f7f4 0%, #e8e6e0 100%);
      color: #1a1a1a;
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      user-select: none;
    }

    /* 左上：NORAロゴ＆コピー */
    .brand-header {
      position: absolute;
      top: 32px;
      left: 36px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      z-index: 10;
    }
    .brand-logo {
      height: 24px;
      width: auto;
      object-fit: contain;
    }
    .brand-tagline {
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      color: #70706d;
      font-weight: 300;
    }

    /* 右下：作品名＆制作年 */
    .work-info {
      position: absolute;
      bottom: 32px;
      right: 36px;
      text-align: right;
      z-index: 10;
    }
    .work-title {
      font-size: 0.78rem;
      letter-spacing: 0.22em;
      color: #2c2c2a;
      font-weight: 400;
    }
    .work-year {
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      color: #8c8c88;
      margin-top: 3px;
    }

    /* 中央：ギャラリー展示ステージ */
    .gallery-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 48px;
      max-width: 90vw;
      max-height: 72vh;
      position: relative;
    }

    /* 写真フレーム（壁に展示された額装作品） */
    .image-container {
      position: relative;
      height: 60vh;
      aspect-ratio: 9 / 16;
      background-color: #eae8e3;
      /* ギャラリーの柔らかいスポットライトと壁面の影 */
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08), 0 2px 10px rgba(0, 0, 0, 0.04);
      overflow: hidden;
    }

    .window-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 1.2s ease-in-out;
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
    }

    .window-image.active {
      opacity: 1;
    }

    /* 進行プログレスバー */
    .timer-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 2px;
      background-color: rgba(26, 26, 26, 0.35);
      width: 0%;
      transition: width 0.1s linear;
      z-index: 6;
    }

    /* 写真に被らない詩の表示領域（右側に縦書きで静かに配置） */
    .poem-side-container {
      width: 140px;
      height: 52vh;
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .poem-text {
      color: #222220;
      font-size: 0.88rem;
      line-height: 2.3;
      letter-spacing: 0.28em;
      writing-mode: vertical-rl; /* 縦書きキャプション風 */
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
    }

    .poem-text.visible {
      opacity: 1;
    }

    /* 下部：トラック選択コントロール */
    .controls {
      position: absolute;
      bottom: 64px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px 32px;
      z-index: 10;
      padding: 0 20px;
    }

    .track-btn {
      background: none;
      border: none;
      color: #8c8c88;
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      cursor: pointer;
      padding: 6px 4px;
      transition: all 0.35s ease;
      position: relative;
    }

    .track-btn:hover {
      color: #1a1a1a;
    }

    .track-btn.active {
      color: #1a1a1a;
      font-weight: 500;
    }

    .track-btn.active::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 1px;
      background-color: #1a1a1a;
    }

    /* スマホ対応（縦画面） */
    @media (max-width: 768px) {
      .gallery-stage {
        flex-direction: column;
        gap: 18px;
        max-height: 65vh;
      }

      .image-container {
        height: 46vh;
      }

      .poem-side-container {
        width: 82vw;
        height: 50px;
        justify-content: center;
      }

      .poem-text {
        writing-mode: horizontal-tb;
        font-size: 0.78rem;
        line-height: 1.6;
        text-align: center;
      }

      .brand-header {
        top: 20px;
        left: 20px;
      }

      .work-info {
        bottom: 20px;
        right: 20px;
      }

      .controls {
        bottom: 48px;
        gap: 10px 16px;
      }

      .track-btn {
        font-size: 0.68rem;
      }
    }
  </style>
</head>
<body>

  <!-- 左上：NORAロゴ＆コピー -->
  <div class="brand-header">
    <img src="images/logo.png" alt="nora" class="brand-logo" id="logo-img" onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='block';">
    <span id="logo-fallback" style="display:none; font-weight:bold; font-size:1.1rem; letter-spacing:0.15em; color:#1a1a1a;">nora</span>
    <span class="brand-tagline">音は、時代を旅する。</span>
  </div>

  <!-- 右下：作品情報 -->
  <div class="work-info">
    <div class="work-title">10 SECONDS : THROUGH THE WINDOW</div>
    <div class="work-year">2026</div>
  </div>

  <!-- 中央：モダンギャラリー展示ステージ -->
  <div class="gallery-stage">
    <!-- 写真作品（額装） -->
    <div class="image-container">
      <img src="images/base.jpg" alt="Window Base" class="window-image active" id="img-base">
      <img src="images/01_morning.jpg" alt="Morning" class="window-image" id="img-morning">
      <img src="images/02_daytime.jpg" alt="Daytime" class="window-image" id="img-daytime">
      <img src="images/03_wind.jpg" alt="Wind" class="window-image" id="img-wind">
      <img src="images/04_rain.jpg" alt="Rain" class="window-image" id="img-rain">
      <img src="images/05_last_train.jpg" alt="Last Train" class="window-image" id="img-last_train">
      <img src="images/06_night.jpg" alt="Night" class="window-image" id="img-night">

      <div class="timer-bar" id="timer-bar"></div>
    </div>

    <!-- 写真の横に配置されるキャプション風の詩 -->
    <div class="poem-side-container">
      <div class="poem-text" id="poem-text"></div>
    </div>
  </div>

  <!-- 下部：トラック選択ボタン -->
  <div class="controls">
    <button class="track-btn" onclick="playTrack('morning')">MORNING</button>
    <button class="track-btn" onclick="playTrack('daytime')">DAYTIME</button>
    <button class="track-btn" onclick="playTrack('wind')">WIND</button>
    <button class="track-btn" onclick="playTrack('rain')">RAIN</button>
    <button class="track-btn" onclick="playTrack('last_train')">LAST TRAIN</button>
    <button class="track-btn" onclick="playTrack('night')">NIGHT</button>
  </div>

  <script>
    const tracks = {
      'morning': {
        imageId: 'img-morning',
        audioSrc: 'audio/01_morning.mp3',
        poem: '朝の光が、昨日と今日の境目をひらく。'
      },
      'daytime': {
        imageId: 'img-daytime',
        audioSrc: 'audio/02_daytime.mp3',
        poem: 'どこか遠くの営みが、風に乗って掠めていく。'
      },
      'wind': {
        imageId: 'img-wind',
        audioSrc: 'audio/03_wind.mp3',
        poem: '見えない時間が、葉を揺らして走り抜ける。'
      },
      'rain': {
        imageId: 'img-rain',
        audioSrc: 'audio/04_rain.mp3',
        poem: '世界を叩く雫が、あの日の記憶を連れてくる。'
      },
      'last_train': {
        imageId: 'img-last_train',
        audioSrc: 'audio/05_last_train.mp3',
        poem: '遠ざかる轍の音が、街の眠りを告げている。'
      },
      'night': {
        imageId: 'img-night',
        audioSrc: 'audio/06_night.mp3',
        poem: '静寂の底で、虫の羽音だけが時代を旅する。'
      }
    };

    let currentAudio = null;
    let timerInterval = null;
    let resetTimeout = null;

    function playTrack(key) {
      stopCurrent();

      const track = tracks[key];
      if (!track) return;

      // 1. 画像切り替え
      document.querySelectorAll('.window-image').forEach(img => img.classList.remove('active'));
      const targetImg = document.getElementById(track.imageId);
      if (targetImg) targetImg.classList.add('active');

      // 2. ボタンアクティブ
      document.querySelectorAll('.track-btn').forEach(btn => {
        if (btn.getAttribute('onclick').includes(`'${key}'`)) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      // 3. 詩の表示（写真の横）
      const poemEl = document.getElementById('poem-text');
      poemEl.innerText = track.poem;
      setTimeout(() => {
        poemEl.classList.add('visible');
      }, 300);

      // 4. 音声の再生
      currentAudio = new Audio(track.audioSrc);
      currentAudio.play().catch(e => console.log("Audio play error:", e));

      // 5. プログレスバー（10秒）
      const progressBar = document.getElementById('timer-bar');
      progressBar.style.width = '0%';
      let elapsed = 0;
      const duration = 10000;

      timerInterval = setInterval(() => {
        elapsed += 100;
        const progress = (elapsed / duration) * 100;
        progressBar.style.width = `${Math.min(progress, 100)}%`;
        if (elapsed >= duration) {
          clearInterval(timerInterval);
        }
      }, 100);

      // 6. 10秒後リセット
      resetTimeout = setTimeout(() => {
        resetToBase();
      }, 10000);
    }

    function stopCurrent() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }
      if (timerInterval) clearInterval(timerInterval);
      if (resetTimeout) clearTimeout(resetTimeout);

      document.getElementById('poem-text').classList.remove('visible');
      document.getElementById('timer-bar').style.width = '0%';
    }

    function resetToBase() {
      stopCurrent();
      
      document.querySelectorAll('.window-image').forEach(img => img.classList.remove('active'));
      document.getElementById('img-base').classList.add('active');

      document.querySelectorAll('.track-btn').forEach(btn => btn.classList.remove('active'));
    }
  </script>
</body>
</html>
