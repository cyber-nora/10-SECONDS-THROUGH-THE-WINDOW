<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>10 SECONDS : THROUGH THE WINDOW — nora</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="viewport">
    
    <!-- HEADER -->
    <header class="header">
      <h1 class="title">10 SECONDS : THROUGH THE WINDOW</h1>
      <p class="subtitle">10 SECONDS IN SEPTEMBER</p>
    </header>

    <!-- WINDOW & STAGE -->
    <main class="window-frame" id="windowFrame" data-scene="none">
      <img src="3416.jpg" alt="Through The Window" class="tree-image" id="treeImage">
      <div class="progress-bar" id="progressBar"></div>
    </main>

    <!-- TRACK SELECTOR CONTROLS -->
    <nav class="controls">
      <button class="track-btn" data-track="01_morning.mp3" data-scene="morning">
        MORNING<br><span class="label-sub">早朝</span>
      </button>
      <button class="track-btn" data-track="02_daytime.mp3" data-scene="daytime">
        DAYTIME<br><span class="label-sub">昼</span>
      </button>
      <button class="track-btn" data-track="03_wind.mp3" data-scene="wind">
        WIND<br><span class="label-sub">風</span>
      </button>
      <button class="track-btn" data-track="04_rain.mp3" data-scene="rain">
        RAIN<br><span class="label-sub">雨</span>
      </button>
      <button class="track-btn" data-track="05_last_train.mp3" data-scene="last_train">
        LAST TRAIN<br><span class="label-sub">最終電車</span>
      </button>
      <button class="track-btn" data-track="06_night.mp3" data-scene="night">
        NIGHT<br><span class="label-sub">夜</span>
      </button>
    </nav>

    <!-- FOOTER -->
    <footer class="footer">
      nora / 音は、時代を旅する。
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
